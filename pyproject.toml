[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-location-interpolater"
version = "0.1.0"
description = "Reconstruct missing photo GPS positions by speed-aware interpolation over the shooting timeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "daftcoder" }]
keywords = ["exif", "gps", "photo", "interpolation", "cli"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: Graphics Conversion",
]
dependencies = ["piexif>=1.1.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "pillow>=10"]

[project.scripts]
pli = "pli.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
